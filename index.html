<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ryuma Hub × Nexron Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism-themes/1.9.0/prism-one-dark.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@3.4.0/tsparticles.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-lua.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #e2e2e2;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        #tsparticles {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        header {
            text-align: center;
            margin-top: 100px;
            animation: fadeIn 1.2s ease-in-out;
        }
        .logos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            margin-bottom: 30px;
        }
        .logos img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
            transition: transform 0.5s ease, box-shadow 0.5s ease, filter 0.5s ease;
        }
        .logos img:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.3);
            filter: brightness(1.2);
        }
        h1 {
            font-weight: 700;
            font-size: 2.8em;
            background: linear-gradient(90deg, #00eaff, #6a6aff, #ff00c8, #ff6f61);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: hueRotate 8s linear infinite;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }
        .subtitle {
            color: #b0b0b0;
            font-size: 1.1em;
            margin-top: 10px;
            letter-spacing: 0.5px;
            animation: fadeIn 1.5s ease-in-out;
        }
        .code-box {
            position: relative;
            margin-top: 60px;
            background: rgba(25, 25, 25, 0.9);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            width: 90%;
            max-width: 800px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.7);
            animation: fadeUp 1.2s ease-in-out;
            transition: transform 0.3s ease;
        }
        .code-box:hover {
            transform: translateY(-5px);
        }
        pre[class*="language-"] {
            margin: 0;
            padding: 25px;
            border-radius: 16px;
            background: transparent !important;
            font-size: 1.1em;
            line-height: 1.5;
        }
        .copy-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #1c1c1c;
            border: 1px solid #444;
            color: #e2e2e2;
            font-size: 0.9em;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .copy-btn:hover {
            background: #2b2b2b;
            border-color: #00eaff;
            color: #fff;
            transform: scale(1.05);
        }
        .copy-btn:active {
            transform: scale(0.95);
        }
        iframe {
            margin-top: 70px;
            width: 90%;
            max-width: 800px;
            height: 450px;
            border: none;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
            animation: fadeUp 1.4s ease-in-out;
            transition: transform 0.3s ease;
        }
        iframe:hover {
            transform: translateY(-5px);
        }
        footer {
            margin-top: 100px;
            text-align: center;
            color: #888;
            font-size: 1em;
            padding-bottom: 50px;
            animation: fadeIn 1.8s ease-in-out;
        }
        footer span {
            color: #ccc;
            font-weight: 600;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(25px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes hueRotate {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }
        @media (max-width: 600px) {
            .logos img { width: 100px; height: 100px; }
            h1 { font-size: 2em; }
            .subtitle { font-size: 0.95em; }
            iframe { height: 250px; }
            .code-box { width: 95%; }
        }
    </style>
</head>
<body>
    <div id="tsparticles"></div>
    <header>
        <div class="logos">
            <a href="https://www.youtube.com/@RYUMAHUB" target="_blank"><img src="https://image2url.com/images/1760582961840-621c8b67-65b0-4006-a322-ba4e8d53d816.webp" alt="Ryuma Hub Logo"></a>
            <a href="https://www.youtube.com/@NexronHub" target="_blank"><img src="https://image2url.com/images/1760583096456-01317385-1b99-413d-a3de-fc1a3faf7f13.png" alt="Nexron Hub Logo"></a>
        </div>
        <h1>Ryuma Hub × Nexron Hub</h1>
        <div class="subtitle">Official Collaboration — Introducing our new script</div>
    </header>
    <div class="code-box">
        <button class="copy-btn" onclick="copyCode()">Copy</button>
        <pre class="language-lua"><code id="code">loadstring(game:HttpGet("https://raw.githubusercontent.com/RyumaHub/14/main/W.lua"))()</code></pre>
    </div>
    <iframe src="https://www.youtube.com/embed/hYGUvxq8Vds?si=cS3U85zTUYkp8sDa" title="Showcase" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    <footer>
        <span>© 2025 Ryuma Hub × Nexron Hub
    </footer>
    <script>
        tsParticles.load("tsparticles", {
            particles: {
                number: { value: 120, density: { enable: true, value_area: 800 } },
                color: { value: ["#00eaff", "#6a6aff", "#ff00c8", "#ff6f61"] },
                shape: { type: ["circle", "star", "triangle"], polygon: { nb_sides: 5 } },
                opacity: { value: 0.4, random: true, anim: { enable: true, speed: 0.5, opacity_min: 0.1 } },
                size: { value: 3, random: true, anim: { enable: true, speed: 2, size_min: 0.5 } },
                move: {
                    enable: true,
                    speed: 1.5,
                    direction: "none",
                    random: true,
                    straight: false,
                    outModes: { default: "out" },
                    attract: { enable: true, rotateX: 600, rotateY: 1200 }
                },
                line_linked: {
                    enable: true,
                    distance: 100,
                    color: "#ffffff",
                    opacity: 0.2,
                    width: 1
                }
            },
            interactivity: {
                events: {
                    onHover: { enable: true, mode: "grab" },
                    onClick: { enable: true, mode: "push" },
                    resize: true
                },
                modes: {
                    grab: { distance: 150, line_linked: { opacity: 0.5 } },
                    push: { particles_nb: 4 },
                    repulse: { distance: 100, duration: 0.4 }
                }
            },
            detectRetina: true,
            background: { color: "transparent" }
        });
        function copyCode() {
            const code = document.getElementById("code").textContent;
            navigator.clipboard.writeText(code).then(() => {
                const btn = document.querySelector(".copy-btn");
                btn.textContent = "¡Copied! ✓";
                btn.style.background = "#0a3d62";
                btn.style.color = "#00eaff";
                setTimeout(() => {
                    btn.textContent = "Copy";
                    btn.style.background = "#1c1c1c";
                    btn.style.color = "#e2e2e2";
                }, 2000);
            }).catch(err => {
                console.error("Error to Copy: ", err);
            });
        }
    </script>
</body>
</html>
